<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <base href="/founder-akatech/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Thème appliqué avant le premier affichage : pas de flash clair/sombre -->
  <script>try{var t=localStorage.getItem('theme');document.documentElement.dataset.theme=(t==='light'||t==='dark')?t:'dark'}catch(e){}</script>

  <!-- Secours statique pour les robots qui n'exécutent pas le JavaScript.
       Les vraies valeurs sont importées depuis src/lib/founder-akatech/portfolioData.js (export SEO) et remplacées par js/main.js. -->
  <title>M'Bollo Aka — Développeur Web Full Stack à Abidjan | AKATech Studio.</title>
  <meta name="description" content="M'Bollo aka, développeur web full stack à Abidjan (Côte d'Ivoire) : sites vitrines, e-commerce, applications React/Django/Flask. Devis rapide, livraison sous 3 à 14 jours, nom de domaine et hébergement offerts 1 an.">
  <link rel="canonical" href="https://mbolloaka-dev.vercel.app/">
  <meta name="theme-color" content="#FF5500">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_CI">
  <meta property="og:title" content="M'Bollo Aka — Développeur Web Full Stack à Abidjan | AKATech Studio.">
  <meta property="og:description" content="M'Bollo aka, développeur web full stack à Abidjan (Côte d'Ivoire) : sites vitrines, e-commerce, applications React/Django/Flask. Devis rapide, livraison sous 3 à 14 jours, nom de domaine et hébergement offerts 1 an.">
  <meta property="og:url" content="https://mbolloaka-dev.vercel.app/">
  <meta property="og:image" content="https://mbolloaka-dev.vercel.app/assets/images/IMG_20250124_124101KK.webp">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/assets/images/favicon.png">
  
  <link rel="apple-touch-icon" href="/assets/images/favicon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Préchargement des 2 polices du premier écran. Ignoré en double-clic (file://) : le navigateur y refuse le mode CORS (seulement du bruit dans la console). -->
  <script>if(location.protocol!=='file:')['barlow-condensed-latin-900-italic','jetbrains-mono-latin-400-normal'].forEach(function(f){var l=document.createElement('link');l.rel='preload';l.as='font';l.type='font/woff2';l.crossOrigin='';l.href='/assets/fonts/'+f+'.woff2';document.head.appendChild(l)})</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>

  <!-- Fond de page : un VRAI élément (et non le fond de <html>) pour que mix-blend-mode: difference
       des titres puisse s'inverser par rapport à lui (le fond de la racine n'entre pas dans le mélange). -->
  <div class="page-bg" aria-hidden="true"></div>

  <!-- Bande d'images qui suit le curseur (js/fx-spotlight.js) -->
  <div id="spot" class="spot" aria-hidden="true"></div>

  <header id="bar" class="bar"></header>

  <main id="main">
    <section id="accueil" class="hero" data-section="hero"></section>
    <section id="projets" class="projects" data-section="projects"></section>
    <section id="services" class="services" data-section="services"></section>
    <section id="tarifs" class="pricing" data-section="pricing"></section>
    <section id="process" class="process" data-section="process"></section>
    <section id="avis" class="reviews" data-section="reviews"></section>
    <section id="apropos" class="about" data-section="about"></section>
    <section id="faq" class="faq" data-section="faq"></section>
    <section id="contact" class="contact" data-section="contact"></section>
  </main>

  <footer id="footer" class="foot"></footer>

  <noscript>
    <p style="padding:6rem 1.5rem;font:16px/1.6 monospace">
      Ce portfolio a besoin de JavaScript pour s'afficher.
      Pour me joindre : <a href="https://wa.me/2250142507750">WhatsApp +225 01 42 50 77 50</a>.
    </p>
  </noscript>

  <!-- Scripts classiques (pas de modules) + chemins relatifs : la page s'ouvre aussi en double-clic (file://).
       defer garde l'ordre : librairies, puis données, puis effets, puis main.js qui construit la page. -->
  <script defer src="assets/vendor/gsap.min.js"></script>
  <script defer src="assets/vendor/ScrollTrigger.min.js"></script>
  <script defer src="assets/vendor/lenis.min.js"></script>
  <script defer src="lib/cloudinaryVersions.js"></script>
  <script defer src="lib/cloudinary.js"></script>
  <script defer src="/api/founder-akatech/data"></script>
  <script defer src="js/fx-spotlight.js"></script>
  <script defer src="js/fx-process.js"></script>
  <script defer src="js/fx-projects.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
